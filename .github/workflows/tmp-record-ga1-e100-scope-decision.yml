name: Temporary record GA1 E100 scope decision

on:
  push:
    branches:
      - agent/record-ga1-e100-scope-decision

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Append accepted scope decision once
        env:
          DECISION_B64: 
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; import base64, os; p=Path('docs/00_project/decision-log.md'); t=p.read_text(encoding='utf-8'); k='## D-20260816-03 — GA1 초고 생산 범위를 E100까지 확대'; assert k not in t, 'decision already exists'; e=base64.b64decode(os.environ['DECISION_B64']).decode('utf-8'); p.write_text(t.rstrip()+e.rstrip()+'\n', encoding='utf-8')"
      - name: Validate repository
        run: |
          git diff --check
          python tools/validate_canon.py
          python tools/build_index.py --check
          python tools/build_catalog.py --check
          python tools/build_census.py --check
      - name: Commit validated decision only
        shell: bash
        run: |
          rm .github/workflows/tmp-record-ga1-e100-scope-decision.yml
          git add docs/00_project/decision-log.md .github/workflows/tmp-record-ga1-e100-scope-decision.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Control: record GA1 E100 draft-production scope"
          git push origin HEAD:agent/record-ga1-e100-scope-decision
