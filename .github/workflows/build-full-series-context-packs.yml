name: Build full-series Context Packs

on:
  push:
    branches:
      - production/e001-e1100-context-full-series-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-context:
    if: ${{ !contains(github.event.head_commit.message || '', '[context-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: production/e001-e1100-context-full-series-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build source-bound Context Packs
        run: python tools/build_full_series_context_packs.py

      - name: Verify generated coverage is current
        run: python tools/build_full_series_context_packs.py --check

      - name: Commit generated Context outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/13_writing_harness/context_packs/generated
          if git diff --cached --quiet; then
            echo "No generated Context changes to commit."
            exit 0
          fi
          git commit -m "Production: generate E011-E1100 Context Packs [context-generated]"
          git push origin HEAD:production/e001-e1100-context-full-series-v1
