name: Build full-series Context Packs

on:
  push:
    branches:
      - production/e001-e1100-context-full-series-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-context:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[context-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out current validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build semantic-complete source-bound Context Packs
        run: python tools/build_full_series_context_packs_semantic.py

      - name: Verify mandatory semantic coverage is current
        run: python tools/build_full_series_context_packs_semantic.py --check

      - name: Commit generated Context outputs
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/13_writing_harness/context_packs/generated
          if git diff --cached --quiet; then
            echo "No generated Context changes to commit."
            exit 0
          fi
          git commit -m "Production: semantic-complete E011-E1100 Context Packs [context-generated]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
