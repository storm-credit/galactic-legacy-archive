name: Temporary UI narration rework GA1 E58 E59 E61

on:
  push:
    branches:
      - manuscript/ga1-e58-e61-ui-narration-rework
    paths:
      - '.github/workflows/tmp-rework-ga1-e58-e61-ui.yml'

permissions:
  contents: write

jobs:
  rework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply UI-to-scene narration rework
        run: python .github/scripts/tmp_rework_ga1_e58_e61_ui.py
      - name: Validate repository
        run: |
          python tools/validate_canon.py --selftest
          python tools/validate_canon.py
          python tools/build_index.py --check
          python tools/build_catalog.py --check
          python tools/build_census.py --check
          python tools/validate_mecha_lineup.py --selftest
          python tools/validate_mecha_lineup.py
          python tools/validate_frame_formation_integration.py --selftest
          python tools/validate_frame_formation_integration.py
          python tools/validate_role_demand_portfolio.py --selftest
          python tools/validate_role_demand_portfolio.py
          git diff --check
      - name: Commit only manuscript files and remove temporary tooling
        run: |
          git config user.name 'storm-credit'
          git config user.email 'stormcredit0725@gmail.com'
          git rm .github/workflows/tmp-rework-ga1-e58-e61-ui.yml
          git rm .github/scripts/tmp_rework_ga1_e58_e61_ui.py
          git add manuscript/ga1/058-오라-3-v1.md
          git add manuscript/ga1/059-기억이-아니라-출처-v1.md
          git add manuscript/ga1/061-지워달라는-기록-v1.md
          git commit -m 'Rework GA1 E58 E59 E61 UI narration density'
          git push origin HEAD:manuscript/ga1-e58-e61-ui-narration-rework
