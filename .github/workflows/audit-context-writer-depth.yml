name: Audit full-series Context writer depth

on:
  push:
    branches:
      - production/e001-e1100-context-writer-depth-v2
    paths:
      - 'tools/audit_full_series_context_writer_depth.py'
      - 'tools/build_full_series_context_writer_activation*.py'
      - 'tools/run_full_series_context_writer_activation_deep.py'
      - 'tools/finalize_context_load_bearing_overrides.py'
      - 'tools/build_full_series_context_packs*.py'
      - 'docs/00_project/full-series-context-writer-activation-depth-standard-v1.md'
      - 'docs/10_story_architecture/**'
      - 'docs/13_writing_harness/context_packs/generated/**'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/audit_full_series_context_writer_depth.py'
      - 'tools/build_full_series_context_writer_activation*.py'
      - 'tools/run_full_series_context_writer_activation_deep.py'
      - 'tools/finalize_context_load_bearing_overrides.py'
      - 'tools/build_full_series_context_packs*.py'
      - 'docs/00_project/full-series-context-writer-activation-depth-standard-v1.md'
      - 'docs/10_story_architecture/**'
      - 'docs/13_writing_harness/context_packs/generated/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-depth:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out writer-depth branch
        uses: actions/checkout@v4
        with:
          ref: production/e001-e1100-context-writer-depth-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build strict first-pass audit
        run: python tools/audit_full_series_context_writer_depth.py

      - name: Build deep source-bound writer-activation overlays, final epilogue routes and load-bearing assertions
        run: python tools/finalize_context_load_bearing_overrides.py

      - name: Commit writer-depth outputs on production branch
        if: github.event_name != 'pull_request'
        run: |
          TARGETS='docs/99_quality_control/full-series-context-writer-depth-audit-v1.md docs/99_quality_control/full-series-context-writer-depth-audit-v2.md docs/99_quality_control/full-series-context-writer-activation-false-a-redteam-v1.md docs/99_quality_control/full-series-context-load-bearing-manual-redteam-2026-08-20.md docs/13_writing_harness/context_packs/activation'
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo 'Writer-depth outputs already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $TARGETS
          git commit -m 'Production: refresh load-bearing writer-activation Context overlays'
          git push origin HEAD:production/e001-e1100-context-writer-depth-v2

      - name: Show depth and final load-bearing gates
        run: |
          grep -E 'Depth-A:|Depth-B:|Depth-C:' docs/99_quality_control/full-series-context-writer-depth-audit-v1.md
          grep -E 'legacy abstract-cost|HIGH-WATCH entries not|repetition runs still|MACHINE GATE' docs/99_quality_control/full-series-context-writer-activation-false-a-redteam-v1.md || true
          grep -E 'FINAL MANUAL VERDICT|load-bearing episodes checked|new story canon required' docs/99_quality_control/full-series-context-load-bearing-manual-redteam-2026-08-20.md
