name: Temporary E44 E45 patch

on:
  push:
    branches:
      - 'manuscript/ga1-e41-45-draft-v1'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manuscript/ga1-e41-45-draft-v1
      - name: Apply approved scene patches
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p44 = Path('manuscript/ga1/044-다시-조립된-07호-v1.md')
          t44 = p44.read_text(encoding='utf-8')
          old = """시험은 성공했다.

성공이라는 말 뒤에 조건이 일곱 줄 붙었다.

그래도 성공이었다.

외부 임무·정비 조건부 라이선스 초안이 올라왔다.

지정된 구조·정비·훈련 목적.

정해진 유지보수.

의료·기술중지.

데이터 감사.

기관별 제한 청구.

일반 자유비행은 아니었다.

군사 임관도 아니었다.

리안이 마음대로 기체를 끌고 어디든 갈 권리도 없었다.

그러나 학원 밖 임무에 나갈 수 있는 길이 처음으로 생겼다.

하렌이 문서를 읽고 말했다.

“이 정도면 기회야.”

“족쇄이기도 하고.”

“둘 다.”
"""
          new = """시험은 성공했다.

성공이라는 말 뒤에 조건이 일곱 줄 붙었다.

그래도 성공이었다.

시험 결과가 정리되자 외부 임무·정비 조건부 라이선스 초안이 작업장 회의판으로 돌아왔다.

학원 장비담당이 첫 조건을 읽었다.

“외부 사용은 지정된 구조·정비·훈련 목적에 한한다. 매번 임무목적을 먼저 적는다.”

리안이 물었다.

“학원 밖이라는 이유만으로 다시 특별승인을 처음부터 받는 건 아니고?”

“라이선스 범위 안의 임무라면 절차를 시작할 근거가 생긴다. 그렇다고 네가 목적을 정하고 바로 출발하는 건 아니다.”

카라가 다음 줄을 확인했다.

“현장책임자와 임무경계는 출발 전에 지정. 목적이 구조에서 추격이나 전투로 바뀌면 기존 허가로 계속 못 간다.”

네라가 정비조건을 가져갔다.

“우회 냉각·제어는 현재 한계 그대로. 정비주기 넘기면 내가 기술중지. 헬릭스 인증부품은 회사 검사조건도 지켜야 하고.”

헬릭스 기술자가 고개를 끄덕였다.

“방열익과 전력·냉각 데이터는 인증범위만 받습니다. 대신 검사 누락 상태에서 외부운용하면 우리 인증은 자동으로 따라가지 않습니다.”

“기체 전체 원격잠금은?” 네라가 물었다.

“이번 초안에는 없습니다.”

“그럼 그 문장도 남겨요.”

세린은 데이터 부분을 읽었다.

“임무기록은 중립 감사 미러 유지. 사건 원본이나 의료정보가 라이선스 때문에 자동반출되는 구조는 아닙니다.”

중립 감사자가 말했다.

“우리는 임무를 지휘하지 않습니다. 목적과 기록이 합의범위를 벗어나면 감사상 중지·이의를 남길 뿐입니다.”

미아는 리안 이름 옆에 의료조건을 붙였다.

“탑승허가는 임무면허하고 별도야. 면허가 살아 있어도 네 몸이 안 되면 못 타.”

“알아.”

“말로만 알지 말고 서명.”

리안은 의료조건 확인란에 서명했다.

마지막으로 하렌이 전체 문서를 뒤집어 봤다.

“그래서 이게 우리한테 뭘 주는 거지?”

학원 장비담당이 답했다.

“조건을 충족하면 학원 외부의 지정 임무에 07호 팀으로 나갈 수 있는 경로.”

“소유권?” 리안이 물었다.

“아니다.”

“일반 자유비행?”

“아니다.”

“군사 임관?”

“그것도 아니다.”

리안은 문서를 다시 봤다.

마음대로 기체를 끌고 어디든 갈 권리는 없었다. 각 기관의 제한 청구와 빚, 검사, 의료·기술·현장중지, 데이터 감사도 그대로였다.

그러나 학원 안에서 시험만 반복하던 기체가 처음으로 바깥의 실제 임무에 나갈 수 있는 절차를 얻었다.

하렌이 말했다.

“이 정도면 기회야.”

“족쇄이기도 하고.”

“둘 다.”

조건을 없애서 얻은 자유가 아니었다.

조건을 누가 책임지는지 적은 뒤에야 생긴 좁은 출구였다.
"""
          if old not in t44:
              raise SystemExit('E44 target block not found')
          p44.write_text(t44.replace(old, new, 1), encoding='utf-8')

          p45 = Path('manuscript/ga1/045-네-사람이-열어야-움직인다-v1.md')
          t45 = p45.read_text(encoding='utf-8')
          old45 = '하지만 그들은 E42에서 이런 상황을 위해 좁은 비상범위를 미리 적어두었다.'
          new45 = '하지만 그들은 네 잠금을 설계할 때 이런 상황을 위해 좁은 비상범위를 미리 적어두었다.'
          if old45 not in t45:
              raise SystemExit('E45 target line not found')
          p45.write_text(t45.replace(old45, new45, 1), encoding='utf-8')
          PY
      - name: Commit patches
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/ga1/044-다시-조립된-07호-v1.md manuscript/ga1/045-네-사람이-열어야-움직인다-v1.md
          git commit -m 'Revise E44 license scene and remove E45 meta reference'
          git push origin HEAD:manuscript/ga1-e41-45-draft-v1
