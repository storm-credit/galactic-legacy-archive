name: Temporary regenerate index E21-25

on:
  push:
    branches:
      - manuscript/ga1-e21-25-draft-v1

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manuscript/ga1-e21-25-draft-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate generated index files
        run: python tools/build_index.py
      - name: Commit generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HOME.md docs/_index/*.md
          if git diff --cached --quiet; then
            echo "No generated index changes"
          else
            git commit -m "Regenerate index for GA1 E21-25"
            git push origin HEAD:manuscript/ga1-e21-25-draft-v1
          fi
