name: Validate canon and manuscript

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'manuscript/**'
      - 'canon/**'
      - 'docs/**'
    paths:
      - 'docs/**'
      - 'manuscript/**'
      - 'CLAUDE.md'
      - 'README.md'
      - 'templates/**'
      - 'tools/validate_canon.py'
      - 'tools/build_index.py'
      - 'tools/build_catalog.py'
      - 'tools/validate_mecha_lineup.py'
      - 'tools/validate_frame_formation_integration.py'
      - 'tools/validate_role_demand_portfolio.py'
      - '.github/workflows/validate-canon.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'manuscript/**'
      - 'CLAUDE.md'
      - 'README.md'
      - 'templates/**'
      - 'tools/validate_canon.py'
      - 'tools/build_index.py'
      - 'tools/build_catalog.py'
      - 'tools/validate_mecha_lineup.py'
      - 'tools/validate_frame_formation_integration.py'
      - 'tools/validate_role_demand_portfolio.py'
      - '.github/workflows/validate-canon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the checks themselves still fire
        run: python tools/validate_canon.py --selftest
      - name: Validate canon, links and manuscript contracts
        run: python tools/validate_canon.py
      - name: Check the generated index is current
        run: python tools/build_index.py --check
      - name: Check the generated catalogue is current
        run: python tools/build_catalog.py --check
      - name: Verify mecha lineup checks still fire
        run: python tools/validate_mecha_lineup.py --selftest
      - name: Validate mecha lineup planning data
        run: python tools/validate_mecha_lineup.py
      - name: Verify frame-formation integration checks still fire
        run: python tools/validate_frame_formation_integration.py --selftest
      - name: Validate frame-formation integration planning data
        run: python tools/validate_frame_formation_integration.py
      - name: Verify role-demand portfolio checks still fire
        run: python tools/validate_role_demand_portfolio.py --selftest
      - name: Validate role-demand portfolio planning data
        run: python tools/validate_role_demand_portfolio.py
