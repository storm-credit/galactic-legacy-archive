name: Audit pre-writing execution integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/run_full_series_context_writer_activation*.py'
      - 'tools/audit_writer_activation_decision_ownership.py'
      - 'tools/run_full_series_collection_reader_desires*.py'
      - 'tools/audit_collection_desire_semantic_lint.py'
      - 'tools/audit_collection_context_crosslayer.py'
      - 'tools/finalize_context_load_bearing_overrides.py'
      - 'tools/finalize_full_series_collection_reader_desires.py'
      - 'docs/09_collection/**'
      - 'docs/10_story_architecture/**'
      - 'docs/13_writing_harness/context_packs/**'
      - 'docs/00_project/prewriting-execution-integration-closure-2026-08-21.md'
      - 'docs/99_quality_control/continuity-issues.md'
      - '.github/workflows/audit-prewriting-execution-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild writer activation on this exact head
        run: |
          python tools/audit_full_series_context_writer_depth.py
          python tools/run_full_series_context_writer_activation_blindspot.py
          python tools/sanitize_context_activation_provenance.py

      - name: Rebuild Collection Desire on this exact head
        run: python tools/run_full_series_collection_reader_desires_blindspot.py

      - name: Decision-owner anti-centralization gate
        run: python tools/audit_writer_activation_decision_ownership.py

      - name: Collection writer-semantic lint
        run: python tools/audit_collection_desire_semantic_lint.py

      - name: CLSET to episode Context bridge gate
        run: python tools/audit_collection_context_crosslayer.py

      - name: Existing false-A and repetition gates
        run: |
          python tools/audit_full_series_collection_reader_desire_source.py
          python tools/audit_full_series_collection_desire_repetition.py
          grep -q 'MACHINE GATE PASS' docs/99_quality_control/full-series-context-writer-activation-false-a-redteam-v1.md
          grep -q 'FINAL MANUAL VERDICT: PASS' docs/99_quality_control/full-series-context-load-bearing-manual-redteam-2026-08-20.md

      - name: Show integration verdicts
        run: |
          grep -E 'Status: PASS|banned `POV \+ decision|missing owner' docs/99_quality_control/full-series-context-decision-owner-blindspot-audit-v1.md
          grep -E 'Status: PASS|writer-unusable semantic fields' docs/99_quality_control/full-series-collection-desire-semantic-lint-v1.md
          grep -E 'Status: PASS|without exactly one CLSET|overlapping CLSET|hard bridge failures|semantic exit-hook' docs/99_quality_control/full-series-collection-context-crosslayer-audit-v1.md
