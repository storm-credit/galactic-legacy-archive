name: Temporary structural expansion GA1 E46-E53

on:
  push:
    branches:
      - manuscript/ga1-e46-53-structural-expansion
    paths:
      - '.github/workflows/tmp-expand-ga1-e46-53.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply approved scene-beat expansions
        run: python .github/scripts/tmp_expand_ga1_e46_53.py
      - name: Validate repository
        run: |
          python tools/validate_canon.py --selftest
          python tools/validate_canon.py
          python tools/build_index.py --check
          python tools/build_catalog.py --check
          python tools/build_census.py --check
          python tools/validate_mecha_lineup.py --selftest
          python tools/validate_mecha_lineup.py
          python tools/validate_frame_formation_integration.py --selftest
          python tools/validate_frame_formation_integration.py
          python tools/validate_role_demand_portfolio.py --selftest
          python tools/validate_role_demand_portfolio.py
          git diff --check
      - name: Commit manuscript changes and remove temporary tooling
        run: |
          git config user.name 'storm-credit'
          git config user.email 'stormcredit0725@gmail.com'
          git rm .github/workflows/tmp-expand-ga1-e46-53.yml
          git rm .github/scripts/tmp_expand_ga1_e46_53.py
          git add manuscript/ga1/046-두-번째-다섯-번째-답-v1.md
          git add manuscript/ga1/047-스물다섯-명의-동의-v1.md
          git add manuscript/ga1/048-누가-복사했는가-v1.md
          git add manuscript/ga1/049-벌은-가장-넓게-퍼진다-v1.md
          git add manuscript/ga1/050-다섯-번째-답은-없다-v1.md
          git add manuscript/ga1/051-공개된-병원에-없는-치료-v1.md
          git add manuscript/ga1/052-검은-병동은-병원이다-v1.md
          git add manuscript/ga1/053-하루를-사는-사람들-v1.md
          git commit -m 'Revise GA1 E46-E53 with approved scene expansion'
          git push origin HEAD:manuscript/ga1-e46-53-structural-expansion
