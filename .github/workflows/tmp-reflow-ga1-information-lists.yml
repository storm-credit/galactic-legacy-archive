name: Temporary GA1 information-list rhythm reflow

on:
  push:
    branches:
      - manuscript/ga1-information-list-rhythm-reflow
    paths:
      - '.github/workflows/tmp-reflow-ga1-information-lists.yml'

permissions:
  contents: write

jobs:
  reflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reflow information lists without changing content
        run: python .github/scripts/tmp_reflow_ga1_information_lists.py
      - name: Validate repository
        run: |
          python tools/validate_canon.py --selftest
          python tools/validate_canon.py
          python tools/build_index.py --check
          python tools/build_catalog.py --check
          python tools/build_census.py --check
          python tools/validate_mecha_lineup.py --selftest
          python tools/validate_mecha_lineup.py
          python tools/validate_frame_formation_integration.py --selftest
          python tools/validate_frame_formation_integration.py
          python tools/validate_role_demand_portfolio.py --selftest
          python tools/validate_role_demand_portfolio.py
          git diff --check
      - name: Commit manuscript changes and remove temporary tooling
        run: |
          git config user.name 'storm-credit'
          git config user.email 'stormcredit0725@gmail.com'
          git rm .github/workflows/tmp-reflow-ga1-information-lists.yml
          git rm .github/scripts/tmp_reflow_ga1_information_lists.py
          git add manuscript/ga1/066-열한-번의-치료-v1.md
          git add manuscript/ga1/077-천사백사십두-개의-대답-v1.md
          git add manuscript/ga1/078-비밀-이송-v1.md
          git add manuscript/ga1/080-가장-안전한-계약-v1.md
          git add manuscript/ga1/087-소유권이-전원을-끈다-v1.md
          git add manuscript/ga1/097-헌장은-승리문이-아니다-v1.md
          git add manuscript/ga1/098-돌아오지-않는-사람들-v1.md
          git add manuscript/ga1/100-첫-번째-독립-임무-v1.md
          git commit -m 'Reflow GA1 information-list narration rhythm'
          git push origin HEAD:manuscript/ga1-information-list-rhythm-reflow
